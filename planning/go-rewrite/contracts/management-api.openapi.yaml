openapi: 3.1.0
info:
  title: Yaginx Management API v2 Contract
  version: 2.0.0
  description: >-
    Canonical management contract for the Go service. JSON uses lowerCamelCase,
    IDs serialize as strings, and epochs use named ...At fields. The relative
    server URL is served only by the CIDR-restricted independent management
    listener.
servers:
  - url: /yaginx_console
    description: Default bind is 127.0.0.1:9090; business listeners return 404 for this base path.
security:
  - bearerAuth: []
tags:
  - name: account
  - name: website
  - name: web_domain
  - name: analytics
  - name: request_history
  - name: ip_blacklist
  - name: system_errors
  - name: diagnostics
  - name: system_setting
  - name: gateway_node
paths:
  /api/account/login:
    post:
      tags: [account]
      operationId: accountLogin
      security: []
      x-go-handler: internal/management/account.Handler.Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@example.com
              password: secret
      responses:
        '200':
          description: Login succeeds and also sets the secure HttpOnly yaginx-token cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
              example: yaginx-token=eyJ...; expires=Sun, 26 Jul 2026 10:10:00 GMT; path=/; secure; httponly
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginEnvelope' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/account/password_recovery/start:
    post:
      tags: [account]
      operationId: passwordRecoveryStart
      security: []
      x-go-handler: internal/management/account.Handler.PasswordRecoveryStart
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordRecoveryStartRequest' }
      responses:
        '200':
          description: Recovery flow created without revealing whether unrelated accounts exist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordRecoveryStartEnvelope' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/account/password_recovery/verify_email:
    post:
      tags: [account]
      operationId: passwordRecoveryVerifyEmail
      security: []
      x-go-handler: internal/management/account.Handler.PasswordRecoveryVerifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordRecoveryVerifyEmailRequest' }
      responses:
        '200':
          description: Verification code sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BooleanEnvelope' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/account/password_recovery/reset:
    post:
      tags: [account]
      operationId: passwordRecoveryReset
      security: []
      x-go-handler: internal/management/account.Handler.PasswordRecoveryReset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordRecoveryResetRequest' }
      responses:
        '200':
          description: Password changed and recovery state completed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BooleanEnvelope' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/account/refresh_token:
    get:
      tags: [account]
      operationId: accountRefreshToken
      security: []
      x-go-handler: internal/management/account.Handler.RefreshToken
      description: >-
        v2 behavior: authenticated by the
        HttpOnly yaginx-refresh cookie set at login/refresh, not by an
        Authorization bearer, so the session can be renewed after the access
        token itself has expired.
      responses:
        '200':
          description: New access token and a rotated yaginx-refresh cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
              example: yaginx-token=eyJ...; path=/; secure; httponly
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/account/logout:
    post:
      tags: [account]
      operationId: accountLogout
      security: []
      x-go-handler: internal/management/account.Handler.Logout
      description: >-
        Best-effort: revokes the session named by the yaginx-refresh cookie if
        one is present, then always clears both auth cookies and returns 200.
      responses:
        '200':
          description: Cookies cleared; any matching session revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponseEnvelope' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/account/sessions:
    get:
      tags: [account]
      operationId: accountSessionsList
      x-go-handler: internal/management/account.Handler.ListSessions
      description: Active refresh sessions for the caller's own account, most recently used first.
      responses:
        '200':
          description: Active sessions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/account/sessions/{id}/revoke:
    post:
      tags: [account]
      operationId: accountSessionRevoke
      x-go-handler: internal/management/account.Handler.RevokeSession
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Int64String' }
      responses:
        '200':
          description: Session revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponseEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/account/sessions/revoke_others:
    post:
      tags: [account]
      operationId: accountSessionRevokeOthers
      x-go-handler: internal/management/account.Handler.RevokeOtherSessions
      description: Signs out every other active session for the caller's account, keeping the one the request authenticated with.
      responses:
        '200':
          description: Other sessions revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponseEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/account/register:
    post:
      tags: [account]
      operationId: accountRegister
      x-go-handler: internal/management/account.Handler.Register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreateRequest' }
      responses:
        '200':
          description: Account created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponseEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/account/profile:
    get:
      tags: [account]
      operationId: accountProfileGet
      x-go-handler: internal/management/account.Handler.GetProfile
      responses:
        '200':
          description: Current account profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/account/update_profile:
    post:
      tags: [account]
      operationId: accountProfileUpdate
      x-go-handler: internal/management/account.Handler.UpdateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountProfileUpdateRequest' }
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BooleanEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/website/upsert:
    post:
      tags: [website]
      operationId: websiteUpsert
      x-go-handler: internal/management/website.Handler.Upsert
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebsiteUpsertRequest' }
      responses:
        '200':
          description: Created or updated website configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebsiteUpsertEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/website/rule/refresh:
    post:
      tags: [website]
      operationId: websiteRuleRefresh
      x-go-handler: internal/management/website.Handler.RefreshRules
      responses:
        '200':
          description: Returns OK, or the previous ISO-8601 refresh timestamp when called inside the 30-second throttle window.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StringEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/website/delete:
    delete:
      tags: [website]
      operationId: websiteDelete
      x-go-handler: internal/management/website.Handler.Delete
      parameters:
        - $ref: '#/components/parameters/IdQuery'
      responses:
        '200':
          description: Website deleted. Deleting a missing row remains successful if the repository reports no error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponseEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/website/delete_batch:
    post:
      tags: [website]
      operationId: websiteBatchDelete
      x-go-handler: internal/management/website.Handler.DeleteBatch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebsiteBatchDeleteRequest' }
      responses:
        '200':
          description: Deletes every existing requested website and reports IDs that were already absent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebsiteBatchDeleteEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/website/search:
    get:
      tags: [website]
      operationId: websiteSearchGet
      x-go-handler: internal/management/website.Handler.Search
      responses:
        '200':
          description: All websites.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebsiteListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [website]
      operationId: websiteSearchPost
      x-go-handler: internal/management/website.Handler.Search
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebsiteSearchRequest' }
      responses:
        '200':
          description: Paged websites matching optional domain, upstream, and certificate filters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebsitePagedEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/website/get:
    get:
      tags: [website]
      operationId: websiteGet
      x-go-handler: internal/management/website.Handler.Get
      parameters:
        - $ref: '#/components/parameters/IdQuery'
      responses:
        '200':
          description: Website or data null when the mapper receives no row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullableWebsiteEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/website/get_by_name:
    get:
      tags: [website]
      operationId: websiteGetByName
      x-go-handler: internal/management/website.Handler.GetByName
      parameters:
        - $ref: '#/components/parameters/NameQuery'
      responses:
        '200':
          description: Website or data null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullableWebsiteEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/web_domain/upsert:
    post:
      tags: [web_domain]
      operationId: webDomainUpsert
      x-go-handler: internal/management/webdomain.Handler.Upsert
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebDomainUpsertRequest' }
      responses:
        '200':
          description: Domain created or matching existing row updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebDomainEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/web_domain/delete:
    delete:
      tags: [web_domain]
      operationId: webDomainDelete
      x-go-handler: internal/management/webdomain.Handler.Delete
      description: Deletes a Host by legacy numeric id or by name. Deleting by name also purges observed traffic and fails with 409 while a website binds the host.
      parameters:
        - name: id
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Int64String' }
        - name: name
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Domain deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponseEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/web_domain/search:
    get:
      tags: [web_domain]
      operationId: webDomainSearchGet
      x-go-handler: internal/management/webdomain.Handler.Search
      responses:
        '200':
          description: Domains sorted by certificate notAfter descending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebDomainListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [web_domain]
      operationId: webDomainSearchPost
      x-go-handler: internal/management/webdomain.Handler.Search
      requestBody:
        required: false
        content:
          application/json:
              schema: { $ref: '#/components/schemas/WebDomainSearchRequest' }
      responses:
        '200':
          description: Paged domains sorted by stable ID order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebDomainPagedEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/web_domain/get:
    get:
      tags: [web_domain]
      operationId: webDomainGet
      x-go-handler: internal/management/webdomain.Handler.Get
      parameters:
        - $ref: '#/components/parameters/IdQuery'
      responses:
        '200':
          description: Domain or data null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullableWebDomainListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/web_domain/get_by_name:
    get:
      tags: [web_domain]
      operationId: webDomainGetByName
      x-go-handler: internal/management/webdomain.Handler.GetByName
      parameters:
        - $ref: '#/components/parameters/NameQuery'
      responses:
        '200':
          description: Domain or data null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullableWebDomainListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/web_domain/acme/request:
    post:
      tags: [web_domain]
      operationId: webDomainAcmeRequest
      x-go-handler: internal/management/webdomain.Handler.RequestCertificate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcmeRequestBody' }
      responses:
        '200':
          description: Outcome of an operator-triggered ACME issuance attempt, run synchronously.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcmeRequestEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '501': { $ref: '#/components/responses/InternalError' }
  /api/web_domain/acme/status:
    get:
      tags: [web_domain]
      operationId: webDomainAcmeStatus
      x-go-handler: internal/management/webdomain.Handler.CertificateStatus
      parameters:
        - $ref: '#/components/parameters/NameQuery'
      responses:
        '200':
          description: Latest ACME order/certificate snapshot for a domain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcmeStatusEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '501': { $ref: '#/components/responses/InternalError' }

  /api/analytics/overview:
    post:
      tags: [analytics]
      operationId: analyticsOverview
      x-go-handler: internal/management/analytics.Handler.Overview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalyticsOverviewQuery' }
      responses:
        '200':
          description: Shared analytics envelope containing only the requested sections.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsOverviewEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/analytics/domains:
    post:
      tags: [analytics]
      operationId: analyticsDomains
      x-go-handler: internal/management/analytics.Handler.Domains
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalyticsQuery' }
      responses:
        '200':
          description: Domain traffic and error ranking for a bounded time range.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsDomainsEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/analytics/timeseries:
    post:
      tags: [analytics]
      operationId: analyticsTimeseries
      x-go-handler: internal/management/analytics.Handler.Timeseries
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalyticsQuery' }
      responses:
        '200':
          description: Dense subject-aware throughput, bandwidth and error time series.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsTimeseriesEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/analytics/contributions:
    post:
      tags: [analytics]
      operationId: analyticsContributions
      x-go-handler: internal/management/analytics.Handler.Contributions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalyticsQuery' }
      responses:
        '200':
          description: Host request contribution rankings, summary and Top-N plus others timeline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsContributionsEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/analytics/details:
    post:
      tags: [analytics]
      operationId: analyticsDetails
      x-go-handler: internal/management/analytics.Handler.Details
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalyticsPagedQuery' }
      responses:
        '200':
          description: Paged analytics buckets with a maximum page size of 200.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsDetailsEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/analytics/catalog:
    get:
      tags: [analytics]
      operationId: analyticsCatalog
      x-go-handler: internal/management/analytics.Handler.Catalog
      parameters:
        - name: host
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [managed, unmanaged] }
        - name: websiteAssociation
          in: query
          required: false
          schema: { type: string, enum: [associated, unassociated] }
        - name: pageIndex
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 200, default: 50 }
      responses:
        '200':
          description: Paged, normalized Host directory merged from configured and observed sources.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceCatalogEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/analytics/subject:
    get:
      tags: [analytics]
      operationId: analyticsSubject
      x-go-handler: internal/management/analytics.Handler.Subject
      parameters:
        - name: subjectType
          in: query
          required: true
          schema: { type: string, enum: [domain, website] }
        - name: key
