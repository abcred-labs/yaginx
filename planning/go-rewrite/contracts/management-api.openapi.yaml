components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256; issuer Yaginx Proxy Server; audience Yaingx Clients.
  parameters:
    IDPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Int64String' }
    IdQuery:
      name: id
      in: query
      required: true
      schema: { $ref: '#/components/schemas/Int64String' }
    NameQuery:
      name: name
      in: query
      required: true
      schema: { type: string, minLength: 1 }
    NodeIdQuery:
      name: id
      in: query
      required: true
      schema: { type: string, format: uuid }
    AnalyticsFrom:
      name: from
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 0 }
    AnalyticsTo:
      name: to
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 0 }
  responses:
    BadRequest:
      description: Required query parameters are missing or unsupported.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            code: 400
            msg: invalid sections
            errMsg: invalid sections
            tid: 0123456789abcdef0123456789abcdef
            data: { requestId: 0123456789abcdef0123456789abcdef }
    Conflict:
      description: The credential name is already in use.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: The credential does not exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Missing, malformed, expired, or invalid Bearer token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            code: 401
            msg: 授权认证失败
            errMsg: 地址/yaginx_console/api/account/profile授权认证失败
            tid: 0123456789abcdef0123456789abcdef
            data: { requestId: 0123456789abcdef0123456789abcdef }
    Forbidden:
      description: Authenticated but not authorized.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            code: 403
            msg: 无对应授权
            errMsg: 地址/yaginx_console/api/example无对应授权
            tid: 0123456789abcdef0123456789abcdef
            data: { requestId: 0123456789abcdef0123456789abcdef }
    InternalError:
      description: Parameter conversion, validation, business, not-found, and controller exceptions preserve the current HTTP 500 behavior.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            code: 500
            msg: 调用异常
            errMsg: ''
            tid: 0123456789abcdef0123456789abcdef
            data: { requestId: 0123456789abcdef0123456789abcdef }
    Unavailable:
      description: Go node has no writable database connection.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            code: 503
            msg: 服务暂时不可用
            errMsg: 数据库当前不可写
            tid: 0123456789abcdef0123456789abcdef
            data: { requestId: 0123456789abcdef0123456789abcdef }
  schemas:
    Int64String:
      type: string
      pattern: '^-?[0-9]+$'
      examples: ['123456789012345678']
    Int64Input:
      oneOf:
        - $ref: '#/components/schemas/Int64String'
        - type: integer
          format: int64
    EpochSeconds:
      oneOf:
        - $ref: '#/components/schemas/Int64String'
        - type: integer
          format: int64
    NullableString:
      type: [string, 'null']
    EnvelopeBase:
      type: object
      required: [code, msg, errMsg, tid]
      properties:
        code: { type: integer }
        msg: { $ref: '#/components/schemas/NullableString' }
        errMsg: { $ref: '#/components/schemas/NullableString' }
        tid: { type: string }
    ErrorEnvelope:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              additionalProperties: false
              required: [requestId]
              properties:
                requestId: { type: string }
    EmptyResponseEnvelope:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
