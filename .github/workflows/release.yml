name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: gateway/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: adminui/pnpm-lock.yaml
      - name: Build admin UI
        working-directory: adminui
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Build release assets
        env:
          VERSION: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: ./deploy/build-release.sh "${VERSION#v}"
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish GHCR images
        env:
          VERSION: ${{ github.ref_name }}
          IMAGE: ghcr.io/abcred-labs/yaginx
        run: |
          docker build --build-arg BINARY_PATH=artifacts/${VERSION#v}/yaginx-linux-amd64 -f gateway/deploy/docker/Dockerfile -t "$IMAGE:${VERSION#v}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${VERSION#v}"
          docker push "$IMAGE:latest"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**
