name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: yaginx_test
          POSTGRES_PASSWORD: yaginx_test_pw
          POSTGRES_DB: yaginx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U yaginx_test -d yaginx_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: gateway/go.sum
      - name: Verify modules
        working-directory: gateway
        run: go mod verify
      - name: Build, test, and vet
        working-directory: gateway
        run: |
          go build ./cmd/yaginx
          go test -count=1 ./...
          go vet ./...
      - name: Contract checks
        working-directory: gateway
        run: |
          go run ./cmd/contractlint
          go run ./cmd/contractcheck
          go run ./cmd/proxycheck
      - name: Set up pnpm for integration
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: adminui/pnpm-lock.yaml
      - name: Build admin UI for integration
        working-directory: adminui
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Run PostgreSQL integration
        working-directory: gateway
        env:
          YAGINX_TEST_DATABASE_URL: postgres://yaginx_test:yaginx_test_pw@127.0.0.1:5432/yaginx_test?sslmode=disable
        run: go test -p 1 -count=1 -tags integration ./internal/database ./internal/configsync ./internal/repository ./internal/management ./internal/app ./internal/acme ./cmd/legacyimport

  adminui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adminui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: adminui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run api:check
      - run: pnpm test -- --run
      - run: pnpm run build

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yaginx-docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: yaginx-docs-site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build

  contract-tooling:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway/tools/contract-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/tools/contract-lint/package-lock.json
      - run: npm ci
      - run: npm run check-mermaid

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        run: docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.28.0 detect --source=/repo --no-banner --redact
      - uses: anchore/scan-action@v6
        with:
          path: .
          fail-build: false
          severity-cutoff: high
          output-format: table
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.ci.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: ci-sbom
          path: sbom.ci.spdx.json

  docker:
    runs-on: ubuntu-latest
    needs: [go, adminui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: gateway/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - run: pnpm install --frozen-lockfile
        working-directory: adminui
      - run: pnpm run build
        working-directory: adminui
      - run: mkdir -p artifacts/ci && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o artifacts/ci/yaginx-linux-amd64 ./cmd/yaginx
        working-directory: gateway
      - uses: docker/setup-buildx-action@v3
      - run: docker build --build-arg BINARY_PATH=gateway/artifacts/ci/yaginx-linux-amd64 -f gateway/deploy/docker/Dockerfile -t yaginx:ci .
