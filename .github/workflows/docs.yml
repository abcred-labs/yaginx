name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'yaginx-docs-site/**'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: yaginx-docs-site/pnpm-lock.yaml
      - name: Install documentation dependencies
        working-directory: yaginx-docs-site
        run: pnpm install --frozen-lockfile
      - name: Check documentation content
        run: node scripts/check-doc-content.mjs
      - name: Check local documentation links
        run: node scripts/check-doc-links.mjs
      - name: Typecheck and build
        working-directory: yaginx-docs-site
        run: |
          pnpm run typecheck
          pnpm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: yaginx-docs-site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
